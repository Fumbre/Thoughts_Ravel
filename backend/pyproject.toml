[project]
name = "ravel"
version = "0.1.0"
description = ""
authors = [{ name = "Fumbre", email = "ernarovskiyvlad@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.14.1 || >3.14.1,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "networkx (>=3.6.1,<4.0.0)",
    "pyvis (>=0.3.2,<0.4.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "snowflake-id (>=1.0.2,<2.0.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (==7.1.0)",
    "pydantic==2.12.5",
    "python-jose[cryptography]>=3.4,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncmy==0.2.11",
    "passlib[argon2]>=1.7.4,<2.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
